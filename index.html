<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Japan Quiz</title>

    <!-- CSS -->
    <link rel="stylesheet" href="layout.css">
</head>

<body>

    <header>
        <h1>Japan Quiz 🇯🇵</h1>
        <p>How much do you know about Japan?</p>
    </header>

    <main>

        <section class="quiz-container">

            <!-- Quiz progress -->
            <div class="quiz-progress">
                <p>Question <span id="question-number">1</span> of 10</p>
            </div>

            <!-- Question -->
            <div class="question-container">
                <h2 id="question">
                    What is the capital city of Japan?
                </h2>
            </div>

            <!-- Answer choices -->
            <div class="answers">
                <button class="answer-btn">Osaka</button>
                <button class="answer-btn">Tokyo</button>
                <button class="answer-btn">Kyoto</button>
                <button class="answer-btn">Nagoya</button>
            </div>

            <!-- Correct / Incorrect message -->
            <div class="result">
                <p id="result-message"></p>
            </div>

            <!-- Next question -->
            <button id="next-btn">
                Next Question
            </button>

        </section>

    </main>

    <footer>
        <p>Japan Quiz 🇯🇵</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
